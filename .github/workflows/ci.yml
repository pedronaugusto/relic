name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # The whole suite in every build mode, on all three platforms. The suite
  # generates its fixtures with whatever git the runner has, so this is also
  # the git version matrix: three images, three gits.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: git version
        run: git --version

      - name: Formatting
        run: zig fmt --check src examples build.zig build.zig.zon

      - name: Test — Debug
        run: zig build test -Doptimize=Debug

      - name: Test — ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe

      - name: Test — ReleaseFast
        run: zig build test -Doptimize=ReleaseFast

      - name: Test — ReleaseSmall
        run: zig build test -Doptimize=ReleaseSmall

      # Built AND run, against the module a consumer gets.
      - name: Examples
        run: zig build examples

  # The oldest git this claims to work with. Everything the suite compares
  # against is generated by git, so the comparison is only as wide as the
  # versions it is run on.
  old-git:
    name: oldest supported git
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:bullseye
    steps:
      - name: Install git and the toolchain
        run: |
          # bullseye has reached its end of life, and an end-of-life Debian
          # moves to archive.debian.org. The mirrors the image ships with
          # still serve its package lists and no longer serve the packages
          # those lists name, so every fetch is a 404. The security pool is
          # gone from every host that carries it, so that suite is dropped
          # rather than pointed somewhere else, and the archive is what is
          # left. It still has this job's reason for existing: git 2.30.2.
          #
          # The image was built with a handful of packages from the security
          # suite that the archive does not have, and `perl-base` is one git
          # depends on an exact version of. The pin is above 1000, which is
          # what lets apt move a package back to the version the only
          # remaining source has.
          printf '%s\n' 'deb http://archive.debian.org/debian bullseye main' \
            > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*
          printf 'Package: *\nPin: release n=bullseye\nPin-Priority: 1001\n' \
            > /etc/apt/preferences.d/archive
          apt-get update
          apt-get install -y --no-install-recommends --allow-downgrades \
            git curl xz-utils ca-certificates
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - run: git --version
      - run: zig build test -Doptimize=ReleaseSafe

  # A git built from its own master branch. It is allowed to fail: this is
  # the early warning for a format change, not a gate on the release.
  git-master:
    name: git master (not a gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build git from master
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gettext libcurl4-openssl-dev libexpat1-dev libssl-dev zlib1g-dev
          git clone --depth 1 https://github.com/git/git.git /tmp/git
          make -C /tmp/git -j"$(nproc)" NO_TCLTK=1 NO_GETTEXT=1 prefix=/usr/local
          sudo make -C /tmp/git NO_TCLTK=1 NO_GETTEXT=1 prefix=/usr/local install
          git --version
      - run: zig build test -Doptimize=ReleaseSafe

  # README.md's Usage block is a region of examples/usage.zig, which the job
  # above runs. This is what keeps the snippet a reader copies and the code
  # CI executes the same text.
  docs:
    name: documented usage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ci/readme_usage.sh --check

  # Compile-only coverage of the targets the suite cannot execute on. These
  # prove the sources and the build graph are portable; the `test` job above
  # is what proves behaviour.
  cross-compile:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check -Dtarget=${{ matrix.target }}
