name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full merge gate
        type: boolean
        default: false
  pull_request:
  merge_group:
  schedule:
    - cron: '17 4 * * 1'
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  gate:
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@8422cd19dbdb335d2b030138c4167f6166cd397a
    with:
      preflight-ref: 8422cd19dbdb335d2b030138c4167f6166cd397a
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      attest: ${{ github.event_name == 'push' }}
  old-git:
    if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    container: buildpack-deps:bullseye
    timeout-minutes: 30
    env:
      RELIC_GIT: old
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: 8422cd19dbdb335d2b030138c4167f6166cd397a
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build --build-file ci/bootstrap.zig setup -- old
      - uses: ./.preflight/.github/actions/setup
        with:
          install-zig: 'false'
      - run: zig build ci -Dci-lint=false -Doptimize=ReleaseSafe --test-timeout 60s
  git-master:
    if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      RELIC_GIT: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: 8422cd19dbdb335d2b030138c4167f6166cd397a
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
      - run: zig build ci-setup -- master
      - run: zig build ci -Dci-lint=false -Doptimize=ReleaseSafe --test-timeout 60s
