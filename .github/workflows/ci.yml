name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: fast, merge (the candidate for main) or release (before a cut, or after threading or platform work)
        type: choice
        options: [fast, merge, release]
        default: fast
      adopt:
        description: Initialize absent source ledgers from findings already on main
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  skip:
    if: github.event_name != 'push'
    uses: pedronaugusto/preflight/.github/workflows/skip.yml@f6a5191c42d8de76ab758465bf897e7acee931d9
    with:
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      preflight-ref: f6a5191c42d8de76ab758465bf897e7acee931d9
  gate:
    needs: skip
    if: always() && (github.event_name == 'push' || (needs.skip.result == 'success' && needs.skip.outputs.docs-only != 'true'))
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@f6a5191c42d8de76ab758465bf897e7acee931d9
    with:
      preflight-ref: f6a5191c42d8de76ab758465bf897e7acee931d9
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      adopt: ${{ github.event_name == 'workflow_dispatch' && inputs.adopt }}
      attest: ${{ github.event_name == 'push' }}
      # Generated from ci/workflow.json with zig build plan -- --tier fast.
      fast-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug shard 1/2","step":"preflight-fast","args":"-Doptimize=debug -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-0","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 2/2","step":"preflight-fast","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-1","artifact":""}]}
      # Generated with zig build plan -- --tier merge.
      merge-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug shard 1/2","step":"preflight-fast","args":"-Doptimize=debug -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-0","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 2/2","step":"preflight-fast","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-1","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug) shard 1/2","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":30,"cache_key":"e4afe61741b389f7","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug) shard 2/2","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":30,"cache_key":"5d1a5f72ef654d6d","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 1/5","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"1/5","setup":true,"job_timeout":45,"cache_key":"fa5bee37a0838790","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 2/5","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"2/5","setup":true,"job_timeout":45,"cache_key":"a9e42c452d5d75e3","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 3/5","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"3/5","setup":true,"job_timeout":45,"cache_key":"9ff48f85709691ae","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 4/5","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"4/5","setup":true,"job_timeout":45,"cache_key":"b222d3b849c9a870","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 5/5","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"5/5","setup":true,"job_timeout":45,"cache_key":"e7c9d424b434347f","artifact":""}]}
      # Generated with zig build plan -- --tier release.
      release-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"test (ubuntu-latest, Debug)","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":30,"cache_key":"9a956c968ac0fdd9","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=safe -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":30,"cache_key":"e70c97b382de2729","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseFast)","step":"ci","args":"-Doptimize=fast -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":30,"cache_key":"23ee2c24df96e825","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug) shard 1/2","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":30,"cache_key":"e4afe61741b389f7","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug) shard 2/2","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":30,"cache_key":"5d1a5f72ef654d6d","artifact":""},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe) shard 1/2","step":"ci","args":"-Doptimize=safe -Dci-lint=false -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":30,"cache_key":"68b924b768093c13","artifact":""},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe) shard 2/2","step":"ci","args":"-Doptimize=safe -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":30,"cache_key":"f2858105632d16b1","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 1/5","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"1/5","setup":true,"job_timeout":45,"cache_key":"fa5bee37a0838790","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 2/5","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"2/5","setup":true,"job_timeout":45,"cache_key":"a9e42c452d5d75e3","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 3/5","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"3/5","setup":true,"job_timeout":45,"cache_key":"9ff48f85709691ae","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 4/5","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"4/5","setup":true,"job_timeout":45,"cache_key":"b222d3b849c9a870","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 5/5","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"5/5","setup":true,"job_timeout":45,"cache_key":"e7c9d424b434347f","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 1/5","step":"ci","args":"-Doptimize=safe -Dci-lint=false -Dci-timings=true","shard":"1/5","setup":true,"job_timeout":45,"cache_key":"8a28d470fac376d0","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 2/5","step":"ci","args":"-Doptimize=safe -Dci-lint=false -Dci-timings=true","shard":"2/5","setup":true,"job_timeout":45,"cache_key":"aab02b7be65b9704","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 3/5","step":"ci","args":"-Doptimize=safe -Dci-lint=false -Dci-timings=true","shard":"3/5","setup":true,"job_timeout":45,"cache_key":"b9e48464517338ec","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 4/5","step":"ci","args":"-Doptimize=safe -Dci-lint=false -Dci-timings=true","shard":"4/5","setup":true,"job_timeout":45,"cache_key":"ed6d6ba32414fcb6","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 5/5","step":"ci","args":"-Doptimize=safe -Dci-lint=false -Dci-timings=true","shard":"5/5","setup":true,"job_timeout":45,"cache_key":"37ddbac2cad054dd","artifact":""},{"os":"ubuntu-latest","name":"source checks and documented snippets","step":"lint","args":"","shard":"","setup":false,"job_timeout":10,"cache_key":"2bde9497be8664ef","artifact":""},{"os":"ubuntu-latest","name":"compile (ReleaseSmall)","step":"check","args":"-Doptimize=small","shard":"","setup":false,"job_timeout":20,"cache_key":"6efd70ffd2ace30e","artifact":""},{"os":"ubuntu-latest","name":"cross (all configured targets)","step":"preflight-cross","args":"","shard":"","setup":false,"job_timeout":20,"cache_key":"31829ac6da603806","artifact":""},{"os":"ubuntu-latest","name":"ThreadSanitizer (Linux)","step":"test","args":"-Dthread-sanitizer -Doptimize=debug -Dci-lint=false","shard":"","setup":true,"job_timeout":30,"cache_key":"a46e3a3377a10b5d","artifact":""}]}
      windows-git-latest: true
      test-job-timeout: 30
      windows-job-timeout: 45
  old-git:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.tier != 'fast')
    runs-on: ubuntu-latest
    container: buildpack-deps:bookworm
    timeout-minutes: 30
    env:
      RELIC_GIT: old
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: f6a5191c42d8de76ab758465bf897e7acee931d9
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build --build-file ci/bootstrap.zig setup -- old
      # Inside the container the workspace is not where github.workspace says.
      - run: zig build --build-file .preflight/build.zig -Drepo-root="$PWD" fetch
      - run: zig build ci -Dci-lint=false -Doptimize=safe
  git-master:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.tier != 'fast')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      RELIC_GIT: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: f6a5191c42d8de76ab758465bf897e7acee931d9
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
      - run: zig build ci-setup -- master
      - run: zig build ci -Dci-lint=false -Doptimize=safe
