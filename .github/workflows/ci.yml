name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: fast, merge (the candidate for main) or release (before a cut, or after threading or platform work)
        type: choice
        options: [fast, merge, release]
        default: fast
      adopt:
        description: Initialize absent source ledgers from findings already on main
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  skip:
    if: github.event_name != 'push'
    uses: pedronaugusto/preflight/.github/workflows/skip.yml@260ed79cf626e7ab8fb05039db476bb680b4a653
    with:
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      preflight-ref: 260ed79cf626e7ab8fb05039db476bb680b4a653
  gate:
    needs: skip
    if: always() && (github.event_name == 'push' || (needs.skip.result == 'success' && needs.skip.outputs.docs-only != 'true'))
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@260ed79cf626e7ab8fb05039db476bb680b4a653
    with:
      preflight-ref: 260ed79cf626e7ab8fb05039db476bb680b4a653
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      adopt: ${{ github.event_name == 'workflow_dispatch' && inputs.adopt }}
      attest: ${{ github.event_name == 'push' }}
      # Generated from ci/workflow.json with zig build plan -- --tier fast.
      fast-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug shard 1/2","step":"preflight-fast","args":"-Doptimize=Debug -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-0","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 2/2","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-1","artifact":""}]}
      # Generated with zig build plan -- --tier merge.
      merge-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug shard 1/2","step":"preflight-fast","args":"-Doptimize=Debug -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-0","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 2/2","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-1","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug) shard 1/2","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":30,"cache_key":"d4654459d0b04844","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug) shard 2/2","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":30,"cache_key":"c67c748727e95a77","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 1/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"1/5","setup":true,"job_timeout":45,"cache_key":"3cffda578132ff73","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 2/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/5","setup":true,"job_timeout":45,"cache_key":"133fe4c997c62962","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 3/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"3/5","setup":true,"job_timeout":45,"cache_key":"81db91da4286fa54","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 4/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"4/5","setup":true,"job_timeout":45,"cache_key":"689acfb5251095e8","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 5/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"5/5","setup":true,"job_timeout":45,"cache_key":"21e1a1f7e589b40a","artifact":""}]}
      # Generated with zig build plan -- --tier release.
      release-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"test (ubuntu-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":30,"cache_key":"ef78b94c85b7a490","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":30,"cache_key":"26c049815193b44b","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseFast)","step":"ci","args":"-Doptimize=ReleaseFast -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":30,"cache_key":"226e662d2465850f","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug) shard 1/2","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":30,"cache_key":"d4654459d0b04844","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug) shard 2/2","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":30,"cache_key":"c67c748727e95a77","artifact":""},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe) shard 1/2","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":30,"cache_key":"e938744a475b49e2","artifact":""},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe) shard 2/2","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":30,"cache_key":"ebe3c7446dfe1da7","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 1/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"1/5","setup":true,"job_timeout":45,"cache_key":"3cffda578132ff73","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 2/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/5","setup":true,"job_timeout":45,"cache_key":"133fe4c997c62962","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 3/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"3/5","setup":true,"job_timeout":45,"cache_key":"81db91da4286fa54","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 4/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"4/5","setup":true,"job_timeout":45,"cache_key":"689acfb5251095e8","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 5/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"5/5","setup":true,"job_timeout":45,"cache_key":"21e1a1f7e589b40a","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 1/5","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"1/5","setup":true,"job_timeout":45,"cache_key":"ba43e8b82e24af5b","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 2/5","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"2/5","setup":true,"job_timeout":45,"cache_key":"ddd998708b6711bb","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 3/5","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"3/5","setup":true,"job_timeout":45,"cache_key":"700da686211f915b","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 4/5","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"4/5","setup":true,"job_timeout":45,"cache_key":"5360e92875fdca27","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 5/5","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"5/5","setup":true,"job_timeout":45,"cache_key":"4c07c01910a9a441","artifact":""},{"os":"ubuntu-latest","name":"source checks and documented snippets","step":"lint","args":"","shard":"","setup":false,"job_timeout":10,"cache_key":"2bde9497be8664ef","artifact":""},{"os":"ubuntu-latest","name":"compile (ReleaseSmall)","step":"check","args":"-Doptimize=ReleaseSmall","shard":"","setup":false,"job_timeout":20,"cache_key":"6c50ab4fb2b6cda5","artifact":""},{"os":"ubuntu-latest","name":"cross (all configured targets)","step":"preflight-cross","args":"","shard":"","setup":false,"job_timeout":20,"cache_key":"31829ac6da603806","artifact":""},{"os":"ubuntu-latest","name":"ThreadSanitizer (Linux)","step":"test","args":"-Dthread-sanitizer -Doptimize=Debug -Dci-lint=false","shard":"","setup":true,"job_timeout":30,"cache_key":"5165f33548acc5c3","artifact":""}]}
      windows-git-latest: true
      test-job-timeout: 30
      windows-job-timeout: 45
  old-git:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.tier != 'fast')
    runs-on: ubuntu-latest
    container: buildpack-deps:bookworm
    timeout-minutes: 30
    env:
      RELIC_GIT: old
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: 260ed79cf626e7ab8fb05039db476bb680b4a653
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build --build-file ci/bootstrap.zig setup -- old
      # Inside the container the workspace is not where github.workspace says.
      - run: zig build --build-file .preflight/build.zig -Drepo-root="$PWD" fetch
      - run: zig build ci -Dci-lint=false -Doptimize=ReleaseSafe
  git-master:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.tier != 'fast')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      RELIC_GIT: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: 260ed79cf626e7ab8fb05039db476bb680b4a653
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
      - run: zig build ci-setup -- master
      - run: zig build ci -Dci-lint=false -Doptimize=ReleaseSafe
