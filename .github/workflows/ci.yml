name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: fast, merge (the candidate for main) or release (before a cut, or after threading or platform work)
        type: choice
        options: [fast, merge, release]
        default: fast
      status-only:
        description: Verify the recorded merge or release tier for this exact commit
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  skip:
    if: github.event_name != 'push' && !inputs.status-only
    uses: pedronaugusto/preflight/.github/workflows/skip.yml@c04e49d329eaa1cb985cdb6ee07f906dd7d84743
    with:
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      preflight-ref: c04e49d329eaa1cb985cdb6ee07f906dd7d84743
      working-directory: "."
  gate:
    needs: skip
    if: always() && (github.event_name == 'push' || inputs.status-only || (needs.skip.result == 'success' && needs.skip.outputs.docs-only != 'true'))
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@c04e49d329eaa1cb985cdb6ee07f906dd7d84743
    with:
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      working-directory: "."
      preflight-ref: c04e49d329eaa1cb985cdb6ee07f906dd7d84743
      attest: ${{ github.event_name == 'push' || inputs.status-only }}
      fast-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug shard 1/2","step":"preflight-fast","args":"-Doptimize=debug -Dci-timings=true","shard":"1/2","setup":true,"job_timeout":45,"cache_key":"fast-linux-debug-0","artifact":"","operation":"execute"},{"os":"ubuntu-latest","name":"Linux Debug shard 2/2","step":"preflight-fast","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"2/2","setup":true,"job_timeout":45,"cache_key":"fast-linux-debug-1","artifact":"","operation":"execute"}]}
