name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  # The git the Linux gate builds. The suite's reftable fixtures need 2.45
  # and `git refs verify` 2.47, and the runners ship older gits; a pinned
  # release keeps the gate's fixtures from moving under it.
  GIT_VERSION: 2.55.0

jobs:
  # The whole suite in every build mode, on all three platforms, with a git
  # recent enough for every fixture: a pinned release built on Linux,
  # Homebrew's current one on macOS, Chocolatey's current Git for Windows.
  # The job refuses to run the suite on anything older than 2.47, because
  # a fixture that needs a newer git skips rather than fails, and a gate
  # that skips is not one. The floor is the old-git job below.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache git (Linux)
        if: runner.os == 'Linux'
        id: git-cache
        uses: actions/cache@v4
        with:
          path: /opt/git
          key: git-${{ env.GIT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build git (Linux)
        if: runner.os == 'Linux' && steps.git-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libcurl4-openssl-dev libexpat1-dev libssl-dev zlib1g-dev
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-${GIT_VERSION}.tar.xz" -o /tmp/git.tar.xz
          mkdir -p /tmp/git-src && tar -xJf /tmp/git.tar.xz -C /tmp/git-src --strip-components=1
          make -C /tmp/git-src -j"$(nproc)" NO_TCLTK=1 NO_GETTEXT=1 prefix=/opt/git all
          sudo make -C /tmp/git-src NO_TCLTK=1 NO_GETTEXT=1 prefix=/opt/git install

      - name: Use the built git (Linux)
        if: runner.os == 'Linux'
        run: echo /opt/git/bin >> "$GITHUB_PATH"

      - name: Install git (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install git || brew upgrade git
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install git (Windows)
        if: runner.os == 'Windows'
        run: choco upgrade git -y --no-progress

      - name: git version, at least 2.47
        shell: bash
        run: |
          git --version
          version=$(git --version | sed -E 's/^git version ([0-9]+)\.([0-9]+).*/\1 \2/')
          set -- $version
          if [ "$1" -lt 2 ] || { [ "$1" -eq 2 ] && [ "$2" -lt 47 ]; }; then
            echo "git $1.$2 is older than the 2.47 every fixture needs" >&2
            exit 1
          fi

      - name: Formatting
        run: zig fmt --check src examples build.zig build.zig.zon

      - name: Test — Debug
        run: zig build test -Doptimize=Debug

      - name: Test — ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe

      - name: Test — ReleaseFast
        run: zig build test -Doptimize=ReleaseFast

      - name: Test — ReleaseSmall
        run: zig build test -Doptimize=ReleaseSmall

      # The suite under ThreadSanitizer. The delta search runs its candidates
      # concurrently when asked to, and the suite writes one repository from two
      # tasks at once; a race there is a claim a detector can check and a reader
      # cannot. Debug, because that is the mode the detector instruments most
      # completely. Linux only: Windows has no runtime for it, and on the hosted
      # macOS runner the instrumented suite is killed by a segfault before its
      # first test reports, while the same suite passes under ThreadSanitizer on
      # a Mac, where it is run before a release.
      - name: Test — ThreadSanitizer
        if: runner.os == 'Linux'
        run: zig build test -Dthread-sanitizer -Doptimize=Debug --test-timeout 120s

      # Built AND run, against the module a consumer gets.
      - name: Examples
        run: zig build examples

  # The oldest git this claims to work with. Everything the suite compares
  # against is generated by git, so the comparison is only as wide as the
  # versions it is run on.
  old-git:
    name: oldest supported git
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:bullseye
    steps:
      - name: Install git and the toolchain
        run: |
          # bullseye has reached its end of life, and an end-of-life Debian
          # moves to archive.debian.org. The mirrors the image ships with
          # still serve its package lists and no longer serve the packages
          # those lists name, so every fetch is a 404. The security pool is
          # gone from every host that carries it, so that suite is dropped
          # rather than pointed somewhere else, and the archive is what is
          # left. It still has this job's reason for existing: git 2.30.2.
          #
          # The image was built with a handful of packages from the security
          # suite that the archive does not have, and `perl-base` is one git
          # depends on an exact version of. The pin is above 1000, which is
          # what lets apt move a package back to the version the only
          # remaining source has.
          printf '%s\n' 'deb http://archive.debian.org/debian bullseye main' \
            > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*
          printf 'Package: *\nPin: release n=bullseye\nPin-Priority: 1001\n' \
            > /etc/apt/preferences.d/archive
          apt-get update
          apt-get install -y --no-install-recommends --allow-downgrades \
            git curl xz-utils ca-certificates
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - run: git --version
      - run: zig build test -Doptimize=ReleaseSafe

  # A git built from its own master branch. It is allowed to fail: this is
  # the early warning for a format change, not a gate on the release.
  git-master:
    name: git master (not a gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build git from master
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gettext libcurl4-openssl-dev libexpat1-dev libssl-dev zlib1g-dev
          git clone --depth 1 https://github.com/git/git.git /tmp/git
          make -C /tmp/git -j"$(nproc)" NO_TCLTK=1 NO_GETTEXT=1 prefix=/usr/local
          sudo make -C /tmp/git NO_TCLTK=1 NO_GETTEXT=1 prefix=/usr/local install
          git --version
      - run: zig build test -Doptimize=ReleaseSafe

  # README.md's Usage block is a region of examples/usage.zig, which the job
  # above runs. This is what keeps the snippet a reader copies and the code
  # CI executes the same text.
  docs:
    name: documented usage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ci/readme_usage.sh --check

  # Compile-only coverage of the targets the suite cannot execute on. These
  # prove the sources and the build graph are portable; the `test` job above
  # is what proves behaviour.
  cross-compile:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check -Dtarget=${{ matrix.target }}
