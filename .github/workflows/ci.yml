# Generated by preflight from ci/workflow.json: bay generate
name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The release tier, weekly, at this package's own time: the account's runners
    # are never asked for every package's full matrix at once.
    - cron: '22 6 * * 6'
  workflow_dispatch:
    inputs:
      tier:
        description: ci (what every push and pull request runs), release (the full matrix, which a tag requires) or fuzz (the fuzz job alone)
        type: choice
        options: [ci, release, fuzz]
        default: ci
      fuzz-minutes:
        description: The fuzz job's minutes, when not ci/workflow.json's fuzz_minutes (at most 330)
        type: string
        default: ''
concurrency:
  # Every push to main runs on its own commit, so each commit gets its status; a newer
  # update of a pull request replaces the run of the older; a dispatched or scheduled
  # run queues per ref and tier.
  group: ci-${{ github.event_name == 'push' && format('push-{0}', github.sha) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}-{2}', github.event_name, github.ref, github.event_name == 'schedule' && 'release' || inputs.tier) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
