name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full merge gate
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  skip:
    if: github.event_name != 'push'
    uses: pedronaugusto/preflight/.github/workflows/skip.yml@c9402c40326a17daaeb579293960b44c8eb2132b
    with:
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      preflight-ref: c9402c40326a17daaeb579293960b44c8eb2132b
  gate:
    needs: skip
    if: always() && (github.event_name == 'push' || (needs.skip.result == 'success' && needs.skip.outputs.docs-only != 'true'))
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@c9402c40326a17daaeb579293960b44c8eb2132b
    with:
      preflight-ref: c9402c40326a17daaeb579293960b44c8eb2132b
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      attest: ${{ github.event_name == 'push' }}
      # Generated from ci/workflow.json with zig build plan -- --full false.
      fast-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug shard 1","step":"preflight-fast","args":"-Doptimize=Debug -Dci-timings=true","cases":"core-integrations","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-0","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 2","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","cases":"core-history","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-1","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 3","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","cases":"core-transport","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-2","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 4","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","cases":"core-worktree history-3 rename-0 merge-file","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-3","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 5","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","cases":"core-formats recursive-1 history-1 rename-3 history-0 rename-2 rename-1 rename-4","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-4","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 6","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","cases":"revwalk recursive-0 recursive-2 history-4 history-7 history-2 history-5 history-6 rename-5 diff-algorithms","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-5","artifact":""}]}
      measured-plan: true
      test-job-timeout: 30
      windows-job-timeout: 45
  old-git:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    container: buildpack-deps:bullseye
    timeout-minutes: 30
    env:
      RELIC_GIT: old
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: c9402c40326a17daaeb579293960b44c8eb2132b
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build --build-file ci/bootstrap.zig setup -- old
      - run: zig build --build-file .preflight/build.zig fetch
      - run: zig build ci -Dci-lint=false -Doptimize=ReleaseSafe --test-timeout 60s
  git-master:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      RELIC_GIT: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: c9402c40326a17daaeb579293960b44c8eb2132b
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
      - run: zig build ci-setup -- master
      - run: zig build ci -Dci-lint=false -Doptimize=ReleaseSafe --test-timeout 60s
