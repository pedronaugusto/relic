name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full merge gate
        type: boolean
        default: false
  pull_request:
  merge_group:
  schedule:
    - cron: '17 4 * * 1'
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  gate:
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@25a0b56ab1802b3479105a5b477b8fb3b6658869
    with:
      preflight-ref: 25a0b56ab1802b3479105a5b477b8fb3b6658869
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      attest: ${{ github.event_name == 'push' }}
  old-git:
    if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    container: buildpack-deps:bullseye
    timeout-minutes: 30
    env:
      RELIC_GIT: old
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: 25a0b56ab1802b3479105a5b477b8fb3b6658869
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build --build-file ci/bootstrap.zig setup -- old
      - run: zig build --build-file .preflight/build.zig fetch
      - run: zig build ci -Dci-lint=false -Doptimize=ReleaseSafe --test-timeout 60s
  git-master:
    if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      RELIC_GIT: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: 25a0b56ab1802b3479105a5b477b8fb3b6658869
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
      - run: zig build ci-setup -- master
      - run: zig build ci -Dci-lint=false -Doptimize=ReleaseSafe --test-timeout 60s
