name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full merge gate
        type: boolean
        default: false
      adopt:
        description: Initialize absent source ledgers from findings already on main
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  skip:
    if: github.event_name != 'push'
    uses: pedronaugusto/preflight/.github/workflows/skip.yml@389d054750a2638a990f8f7e1cc1b58a87cb62ee
    with:
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      preflight-ref: 389d054750a2638a990f8f7e1cc1b58a87cb62ee
  gate:
    needs: skip
    if: always() && (github.event_name == 'push' || (needs.skip.result == 'success' && needs.skip.outputs.docs-only != 'true'))
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@389d054750a2638a990f8f7e1cc1b58a87cb62ee
    with:
      preflight-ref: 389d054750a2638a990f8f7e1cc1b58a87cb62ee
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      adopt: ${{ github.event_name == 'workflow_dispatch' && inputs.adopt }}
      attest: ${{ github.event_name == 'push' }}
      # Generated from ci/workflow.json with zig build plan -- --full false.
      fast-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug shard 1/6","step":"preflight-fast","args":"-Doptimize=Debug -Dci-timings=true","shard":"1/6","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-0","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 2/6","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/6","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-1","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 3/6","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"3/6","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-2","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 4/6","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"4/6","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-3","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 5/6","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"5/6","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-4","artifact":""},{"os":"ubuntu-latest","name":"Linux Debug shard 6/6","step":"preflight-fast","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"6/6","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"fast-linux-debug-5","artifact":""}]}
      # Generated from ci/workflow.json with zig build plan -- --full true.
      full-matrix: >-
        {"include":[{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 1/5","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"1/5","timeout":"--test-timeout 60s","setup":true,"job_timeout":45,"cache_key":"7f5664b2e0d4a150","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 2/5","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"2/5","timeout":"--test-timeout 60s","setup":true,"job_timeout":45,"cache_key":"5026b125b840895d","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 3/5","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"3/5","timeout":"--test-timeout 60s","setup":true,"job_timeout":45,"cache_key":"95c632c0457356a4","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 4/5","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"4/5","timeout":"--test-timeout 60s","setup":true,"job_timeout":45,"cache_key":"2aec260204f1f902","artifact":""},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe) shard 5/5","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"5/5","timeout":"--test-timeout 60s","setup":true,"job_timeout":45,"cache_key":"74f9bea544ddd740","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 1/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"1/5","timeout":"--test-timeout 60s","setup":true,"job_timeout":45,"cache_key":"37e26d135bef2835","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 2/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/5","timeout":"--test-timeout 60s","setup":true,"job_timeout":45,"cache_key":"cd3f782debd93326","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 3/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"3/5","timeout":"--test-timeout 60s","setup":true,"job_timeout":45,"cache_key":"a1e79122a2deccd1","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 4/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"4/5","timeout":"--test-timeout 60s","setup":true,"job_timeout":45,"cache_key":"cd2b9a35c10391b5","artifact":""},{"os":"windows-latest","name":"test (windows-latest, Debug) shard 5/5","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"5/5","timeout":"--test-timeout 60s","setup":true,"job_timeout":45,"cache_key":"79c0b01b87eef3d8","artifact":""},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe) shard 1/2","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"1/2","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"a113e3816f0bbcb8","artifact":""},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe) shard 2/2","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"2/2","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"e889cd6bebe4859f","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug) shard 1/2","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"1/2","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"ef297decc3a1902a","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug) shard 2/2","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"2/2","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"d7c3adbe31ac9eb5","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseFast)","step":"ci","args":"-Doptimize=ReleaseFast -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"ce9ce14ab4114e41","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"744a8dd8fab3595c","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","timeout":"--test-timeout 60s","setup":true,"job_timeout":30,"cache_key":"1515e052de0dc3f1","artifact":""},{"os":"ubuntu-latest","name":"source checks and documented snippets","step":"lint","args":"","shard":"","timeout":"","setup":false,"job_timeout":10,"cache_key":"d0bac32770bd815b","artifact":""},{"os":"ubuntu-latest","name":"compile (ReleaseSmall)","step":"check","args":"-Doptimize=ReleaseSmall","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"4515d8efc7af7d51","artifact":""},{"os":"ubuntu-latest","name":"cross (all configured targets)","step":"preflight-cross","args":"","shard":"","timeout":"","setup":false,"job_timeout":20,"cache_key":"1b13795de3f7fdd5","artifact":""},{"os":"ubuntu-latest","name":"ThreadSanitizer (Linux)","step":"test","args":"-Dthread-sanitizer -Doptimize=Debug -Dci-lint=false","shard":"","timeout":"--test-timeout 120s","setup":true,"job_timeout":30,"cache_key":"5624537ed09ee953","artifact":""}]}
      windows-git-latest: true
      test-job-timeout: 30
      windows-job-timeout: 45
  old-git:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    container: buildpack-deps:bullseye
    timeout-minutes: 30
    env:
      RELIC_GIT: old
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: 389d054750a2638a990f8f7e1cc1b58a87cb62ee
          path: .preflight
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build --build-file ci/bootstrap.zig setup -- old
      - run: zig build --build-file .preflight/build.zig fetch
      - run: zig build ci -Dci-lint=false -Doptimize=ReleaseSafe --test-timeout 60s
  git-master:
    needs: skip
    if: needs.skip.outputs.docs-only != 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.full)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      RELIC_GIT: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: 389d054750a2638a990f8f7e1cc1b58a87cb62ee
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
      - run: zig build ci-setup -- master
      - run: zig build ci -Dci-lint=false -Doptimize=ReleaseSafe --test-timeout 60s
