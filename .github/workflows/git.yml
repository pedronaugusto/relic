# Git master, the one compatibility contract preflight cannot yet run advisory in the
# generated CI (the oldest supported git is a job of ci/workflow.json); it goes there
# once preflight's declared jobs can be advisory.
name: Git compatibility
on:
  workflow_dispatch:
concurrency:
  group: git-compatibility-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  git-master:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      RELIC_GIT: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pedronaugusto/preflight
          ref: b28046cc22055fcd32640117fc0e6965283a8ae5
          path: .preflight
      - uses: ./.preflight/.github/actions/setup
      - run: zig build ci-setup -- master
      - run: zig build ci -Dci-lint=false -Doptimize=safe
